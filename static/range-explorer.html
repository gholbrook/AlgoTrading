<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gridlab · Long-range explorer</title>
<script>if(localStorage.getItem('gridline.theme')==='light')document.documentElement.dataset.theme='light';</script>
<link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/range-explorer.css">
<script src="/static/range-explorer.js" defer></script></head>
<body><main class="explorer">
<header class="explorer-header"><div><a href="/">gridlab</a><h1>Long-range explorer</h1></div>
<nav><a href="/value-area">Value-area test</a><label class="import-label">Import results JSON<input id="import" type="file" accept=".json,application/json"></label><button id="fullscreen">Full screen</button></nav></header>
<p id="status" role="status" aria-live="polite">Loading your BTC/USDT experiment…</p>
<div class="explorer-controls">
<button id="overview">All history</button>
<button id="zoom-in" aria-label="Zoom in">＋</button><button id="zoom-out" aria-label="Zoom out">−</button>
<label title="Exponential moving average of 200 candle closes"><input id="ema" type="checkbox" checked><span class="ema-swatch" aria-hidden="true"></span>EMA 200</label>
<label title="Exponential moving average of 21 candle closes"><input id="ema21" type="checkbox" checked><span class="ema-swatch ema21-swatch" aria-hidden="true"></span>EMA 21</label>
<label title="Exponential moving average of 50 candle closes"><input id="ema50" type="checkbox" checked><span class="ema-swatch ema50-swatch" aria-hidden="true"></span>EMA 50</label>
<label><input id="macd" type="checkbox" checked>MACD (12, 26, 9)</label>
</div>
<section id="chart-area" tabindex="0" aria-label="Interactive price chart. Drag to pan, scroll to zoom, or use the toolbar.">
<canvas id="price-chart"></canvas><canvas id="crosshair"></canvas></section>
<div class="chart-help"><span id="view-info"></span><span>Drag to pan · Scroll to zoom at pointer · Shift + scroll to pan</span></div>
<p id="hover" class="readout">Hover over a candle to inspect OHLC and volume.</p>
</main></body></html>
